<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;overflow:hidden}.page{position:fixed;inset:0 0 95px 0;border:0;width:100%;height:calc(100% - 95px)}.bottom-nav{position:fixed;bottom:15px;left:12px;right:12px;height:70px;background:#fff;border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:0 4px 18px #bbb;z-index:999}.nav-item{width:100%;height:65px;border:0;background:none;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:11px;color:#4900D3;cursor:pointer}.nav-item i{font-size:20px;color:#4900D3}.store-button{justify-self:center;width:64px;height:64px;border-radius:50%;border:5px solid #f5f6fa;background:#4900D3;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;margin-top:-30px;box-shadow:0 4px 12px #999;cursor:pointer}.store-button i{font-size:25px;color:#fff}.store-button span{font-size:10px;margin-top:2px;color:#fff}
</style>
</head>
<body><iframe id="page" class="page" src="home.html"></iframe><nav class="bottom-nav">
<button class="nav-item active" onclick="goTo('home.html',this)"><i class="fas fa-home"></i><span>Home</span></button>
<button class="nav-item" onclick="goTo('Creditledger.html',this)"><i class="fas fa-book"></i><span>Credit</span></button>
<button class="store-button" onclick="goTo('store.html',this)"><i class="fas fa-store"></i><span>Store</span></button>
<button class="nav-item" onclick="goTo('transaction.html',this)"><i class="fas fa-exchange-alt"></i><span>Transaction</span></button>
<button class="nav-item" onclick="goTo('account.html',this)"><i class="fas fa-user-circle"></i><span>Account</span></button>
</nav><script>
function goTo(page,button){
  document.getElementById('page').src=page
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'))
  if(button.classList.contains('nav-item'))button.classList.add('active')
}
</script></body>
</html>
